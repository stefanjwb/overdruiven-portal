# ============================================================
# Vervang "jouwdomein.nl" overal door je echte domeinnaam
# ============================================================

# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
    listen 80;
    server_name jouwdomein.nl www.jouwdomein.nl;

    # Certbot gebruikt dit pad om het SSL-certificaat aan te vragen
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name jouwdomein.nl www.jouwdomein.nl;

    # SSL-certificaten van Let's Encrypt (worden ingevuld door certbot)
    ssl_certificate     /etc/letsencrypt/live/jouwdomein.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jouwdomein.nl/privkey.pem;

    # Moderne SSL-instellingen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: browser onthoudt dat HTTPS verplicht is (1 jaar)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Bestandsgrootte voor uploads (profielfoto's, bonnetjes)
    client_max_body_size 20M;

    # API-verzoeken doorsturen naar de FastAPI-backend
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React SPA: alle andere paden naar index.html sturen
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache statische bestanden agressief (Vite voegt hash toe aan bestandsnamen)
        location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
